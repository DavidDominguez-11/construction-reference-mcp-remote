# Cloud Build configuration for deploying to Google Cloud Run.
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml .
#
# Required substitutions (can be set via --substitution or trigger config):
#   _SERVICE_NAME  — Cloud Run service name (default: construction-reference-mcp)
#   _REGION        — Cloud Run region           (default: us-central1)

substitutions:
  _SERVICE_NAME: construction-reference-mcp
  _REGION: us-central1

steps:
  # 1. Build the container image.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
      - '.'

  # 2. Push the image to Container Registry.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'

  # 3. Deploy to Cloud Run.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
